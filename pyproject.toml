[build-system]
requires = ["setuptools>=61", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ircstream"]

[tool.setuptools_scm]
version_scheme = "release-branch-semver"
write_to = "ircstream/_version.py"

[project]
requires-python = ">=3.11"
name = "ircstream"
dynamic = ["version"]
authors = [
    {name = "Faidon Liambotis", email = "paravoid@debian.org"},
]
maintainers = [
    {name = "Faidon Liambotis", email = "paravoid@debian.org"},
]
description = "MediaWiki RC→IRC gateway"
readme = "README.md"
keywords = ["irc", "mediawiki", "wikimedia"]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Wiki",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
dependencies = [
    "prometheus_client>=0.16.0",
    "structlog>=22.3.0",
]

[dependency-groups]
coverage = [
    "coverage[toml]",
]
tests = [
    {include-group = "coverage"},
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "irc",
    "pyyaml",
]
type = [
    "ty==0.0.42",
    "mypy==2.1.0",
    "types-PyYAML",
]
lint = [
    "validate-pyproject[all]==0.25",
    "ruff==0.15.15",
]
dev = [
    {include-group = "tests"},
    {include-group = "type"},
    {include-group = "lint"},
]

[project.urls]
homepage = "https://github.com/paravoid/ircstream"
repository = "https://github.com/paravoid/ircstream.git"

[project.scripts]
ircstream = "ircstream.main:run"

# testing
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "^\\s*raise NotImplementedError\\b",
    "^\\s*return NotImplemented\\b",
    '^if __name__ == "__main__":$',
    'if TYPE_CHECKING:',
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "irc.*"
ignore_missing_imports = true

# linters
[tool.ruff]
line-length = 120
lint.select = [
    "F",      # Pyflakes
    "E",      # pycodestyle Error
    "W",      # pycodestyle Warning
    "I",      # isort
    "PLE",    # Pylint Errors
    "PLW",    # Pylint Warning
    "PLC",    # Pylint Conventions
    "N",      # pep8-naming
    "D",      # pydocstyle
    "UP",     # pyupgrade
    "YTT",    # flake8-2020
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "FA",     # flake8-future-annotations
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "LOG",    # flake8-logging
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "RSE",    # flake8-raise
    "SLF",    # flake8-self
    "TID",    # flake8-tidy-imports
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "FURB",   # refurb
    "RUF",    # Ruff-specific rules
]
lint.ignore = [
    "D107", # Missing docstring in `__init__`
    "D202", # https://github.com/PyCQA/pydocstyle/issues/627
    "D203", # incompatible with D211
    "D213", # incompatible with D212
    "ISC001", # incompatible with the ruff formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "ASYNC109",  # Async function definition with a `timeout` parameter
    "S101",      # Use of `assert` detected
]

[tool.tox]
requires= ["tox>=4.23"]
envlist = ["py311", "py311-bookworm", "type", "lint", "coverage"]
skip_missing_interpreters = true

[tool.tox.env_run_base]
description = "run the unit tests with pytest under {env_name}"
usedevelop = true
dependency_groups = ["tests"]
commands = [["pytest", "--quiet", "--cov=ircstream"]]
parallel_show_output = true
set_env.COVERAGE_FILE = { replace = "env", name = "COVERAGE_FILE", default = "{work_dir}{/}.coverage.{env_name}" }

[tool.tox.env.py311-bookworm]
description = "run the unit tests with pytest for Debian bookworm"
deps = [
    "prometheus_client==0.16.0",
    "structlog==22.3.0",
]

[tool.tox.env.coverage]
skip_install = true
dependency_groups = ["coverage"]
setenv.COVERAGE_FILE = "{toxworkdir}/.coverage"
commands = [
    ["coverage", "erase"],
    ["coverage", "combine"],
    ["coverage", "report", "-m"],
    ["coverage", "html", "-d", "{toxworkdir}/htmlcov"],
]
depends = ["py311"]
parallel_show_output = true

[tool.tox.env.type]
description = "run type check on codebase"
dependency_groups = ["tests", "type"]
commands = [
    ["mypy", "."],
    ["ty", "check"],
]
parallel_show_output = true

[tool.tox.env.lint]
description = "lint the codebase"
dependency_groups = ["lint"]
commands = [
    ["validate-pyproject", "pyproject.toml"],
    ["ruff", "check"],
    ["ruff", "format", "--check"],
]
parallel_show_output = true
